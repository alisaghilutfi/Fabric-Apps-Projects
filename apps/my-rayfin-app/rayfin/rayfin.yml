id: my-rayfin-app
name: my-rayfin-app
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://lucid-iris-65e5e06ded-northeurope.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: true
    path: "packages/functions"
    buildCommand: "npm run build"
    auth:
      type: "application"
secrets:
  - name: ANTHROPIC_API_KEY
    description: Anthropic API key used by classifyTask to call Claude Haiku.

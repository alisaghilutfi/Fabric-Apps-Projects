id: fabricapp-usgs-earthquake
name: FabricApp_USGS_Earthquake
version: 1.0.0
services:
  connectors:
    enabled: true
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://daily-cave-2c1879b505-northeurope.webapp.fabricapps.net
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: sm_usgs_earthquake
    type: fabric-semanticmodel
    config:
      workspaceId: 39caa3ab-a964-45c2-bd5b-7d46ad66c985
      itemId: 856acf3d-ddbc-4ed7-87a8-559018c12f05
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
